name: Build Xunlei VR Player APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xunlei-vrplayer
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Normalize Java override annotations
        run: find app/src/main/java -name '*.java' -type f -exec sed -i 's/@Override //g' {} +

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          tail -n 400 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XunleiVRPlayer-build-log
          path: xunlei-vrplayer/build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XunleiVRPlayer-debug-apk
          path: xunlei-vrplayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
