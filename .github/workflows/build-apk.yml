name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact Touch Addon part
        run: cat touch_parts/touch2a.txt touch_parts/touch2b.txt > touch_parts/touch2.txt

      - name: Apply v0.9.6 stable Android shell patch
        run: python3 patch_v083.py

      - name: Apply Mobile v1.0.3 native bridge and input gate
        run: python3 patch_mobile_v103.py

      - name: Apply Mobile v1.0.4 translation proxy and durable cache
        run: python3 patch_mobile_v104.py

      - name: Apply Mobile v1.0.7 hybrid translation sync
        run: python3 patch_mobile_v107_hybrid.py

      - name: Apply Mobile formal V1.0 response/cache/audio optimization
        run: python3 patch_mobile_v108_final.py

      - name: Repair literal JavaScript regex escaping
        run: python3 patch_mobile_v108_jsfix.py

      - name: Preserve warning/error colors
        run: python3 patch_mobile_v108_uifix.py

      - name: Apply Mobile V1.1 PC translation sync
        run: python3 patch_mobile_v110_pc_translation_sync.py

      - name: Apply Mobile V1.1.1 automatic translation scheduler fix
        run: python3 patch_mobile_v111_auto_scheduler.py

      - name: Validate embedded addon JavaScript
        run: node --check app/src/main/assets/touch_addon.js

      - name: Build installable Android 16 APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TaimaninRPGXViewer-Mobile-V1.1.1-Android16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaimaninRPGXViewer-Mobile-V1.1.1-Android16-APK
          path: TaimaninRPGXViewer-Mobile-V1.1.1-Android16.apk
