name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch Android page-number submit handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/taimaninviewer/DirectFileViewerActivityV81.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v0.8.1', 'v0.8.3')
          marker = """    setTimeout(function(){scan();fit();},100);setTimeout(function(){scan();fit();},500);setTimeout(function(){scan();fit();},1500);
    return 'installed';"""
          injection = r"""    setTimeout(function(){scan();fit();},100);setTimeout(function(){scan();fit();},500);setTimeout(function(){scan();fit();},1500);

    // Android IME compatibility for the scene-select page number box.
    // Desktop code listens to KeyboardEvent.code; Android soft keyboards may only send key/keyCode,
    // or may commit by blurring the input. Keep the original Viewer untouched and bridge those cases here.
    function androidCommitPageInput(inp){
      try{
        if(!inp||inp.id!=='page-number')return false;
        var raw=String(inp.value||'').trim();
        if(!/^\d+$/.test(raw))return false;
        var target=parseInt(raw,10);
        if(typeof main==='undefined'||typeof sceneSelect==='undefined'||typeof prefs==='undefined'||typeof constructSceneSelect!=='function'||!main.sceneList)return false;
        var pp=prefs.select.rows*prefs.select.columns;
        var max=Math.floor((main.sceneList.length-1)/pp)+1;
        if(!isFinite(target)||target<1||target>max)return false;
        sceneSelect.page=target-1;
        constructSceneSelect();
        try{inp.blur();}catch(_e){}
        return true;
      }catch(e){console.error('[ANDROID PAGE JUMP] '+e);return false;}
    }
    var pn=document.getElementById('page-number');
    if(pn){
      pn.setAttribute('inputmode','numeric');
      pn.setAttribute('enterkeyhint','go');
      pn.setAttribute('autocomplete','off');
      window.__androidCommitPageInput=androidCommitPageInput;
      var lastPageCommit=0;
      var suppressNextClickUntil=0;
      function androidIsEnter(e){return !!e&&(e.key==='Enter'||e.code==='Enter'||e.code==='NumpadEnter'||e.keyCode===13||e.which===13);}

      document.addEventListener('keydown',function(e){
        if(e.target===pn&&androidIsEnter(e)){
          if(androidCommitPageInput(pn)){
            lastPageCommit=Date.now();
            e.preventDefault();e.stopImmediatePropagation();
          }
        }
      },true);

      document.addEventListener('keyup',function(e){
        if(e.target===pn&&androidIsEnter(e)){
          if(Date.now()-lastPageCommit<500||androidCommitPageInput(pn)){
            lastPageCommit=Date.now();
            e.preventDefault();e.stopImmediatePropagation();
          }
        }
      },true);

      document.addEventListener('beforeinput',function(e){
        if(e.target===pn&&(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph')){
          if(androidCommitPageInput(pn)){
            lastPageCommit=Date.now();
            e.preventDefault();e.stopImmediatePropagation();
          }
        }
      },true);

      // Some Android IMEs implement their action key by simply dismissing/focusing out.
      document.addEventListener('focusout',function(e){
        if(e.target===pn)androidCommitPageInput(pn);
      },true);

      // Backup: while a pure page number is being edited, tapping the original >> button submits it.
      // If no page number is being edited, >> keeps its normal next-page behavior.
      document.addEventListener('pointerdown',function(e){
        var next=e.target&&e.target.closest?e.target.closest('#next-page'):null;
        if(next&&document.activeElement===pn&&/^\d+$/.test(String(pn.value||'').trim())){
          if(androidCommitPageInput(pn)){
            suppressNextClickUntil=Date.now()+800;
            e.preventDefault();e.stopImmediatePropagation();
          }
        }
      },true);
      document.addEventListener('click',function(e){
        var next=e.target&&e.target.closest?e.target.closest('#next-page'):null;
        if(next&&Date.now()<suppressNextClickUntil){
          suppressNextClickUntil=0;
          e.preventDefault();e.stopImmediatePropagation();
        }
      },true);
    }

    return 'installed';"""
          if marker not in s:
              raise SystemExit('mobile patch marker not found')
          s = s.replace(marker, injection, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TaimaninRPGXViewer-v0.8.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaimaninRPGXViewer-v0.8.3-APK
          path: TaimaninRPGXViewer-v0.8.3.apk
