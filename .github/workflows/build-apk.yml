name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore exact Touch Addon part
        run: cat touch_parts/touch2a.txt touch_parts/touch2b.txt > touch_parts/touch2.txt

      - name: Apply v0.9.6 stable Android shell patch
        run: python3 patch_v083.py

      - name: Apply Mobile v1.0.3 native bridge and input gate
        run: python3 patch_mobile_v103.py

      - name: Apply Mobile v1.0.4 translation proxy and durable cache
        run: python3 patch_mobile_v104.py

      - name: Apply Mobile v1.0.6 Plus cloud glossary translation
        run: python3 patch_mobile_v106_plus_cloud_chunks.py

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TaimaninRPGXViewer-Mobile-v1.0.6-PlusCloudGlossary.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaimaninRPGXViewer-Mobile-v1.0.6-PlusCloudGlossary-APK
          path: TaimaninRPGXViewer-Mobile-v1.0.6-PlusCloudGlossary.apk
